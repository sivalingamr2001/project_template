
<div id="erd" style="padding: 1rem 0;"></div>
<style>
#erd svg { width: 100%; height: auto; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2928' : '#f1efe8',
    primaryBorderColor: dark ? '#5f5e5a' : '#b4b2a9',
  },
});

const diagram = `erDiagram
  AccessRequests {
    int RequestId PK
    varchar TicketNumber
    int RequesterId FK
    int DepartmentId FK
    varchar AggregateStatus
    bit IsActive
    datetime CreatedOn
    int CreatedBy FK
    datetime UpdatedOn
    int ModifiedBy FK
  }

  AccessItems {
    int AccessItemId PK
    int RequestId FK
    varchar FileName
    text FolderPath
    varchar AccessType
    varchar Status
    datetime ApprovedUntilUtc
    int ParentAccessItemId FK
    int ResubmissionCount
    bit IsActive
    datetime CreatedOn
    int CreatedBy FK
    datetime UpdatedOn
    int ModifiedBy FK
  }

  AccessItemReviews {
    int ReviewId PK
    int AccessItemId FK
    varchar Stage
    int ReviewerId FK
    text Note
    bit IsActive
    datetime CreatedOn
    int CreatedBy FK
    datetime UpdatedOn
    int ModifiedBy FK
  }

  RequestAuditTrail {
    int AuditId PK
    int RequestId FK
    varchar EventType
    text Message
    bit IsActive
    datetime CreatedOn
    int CreatedBy FK
    datetime UpdatedOn
    int ModifiedBy FK
  }

  AccessRequests ||--|{ AccessItems : contains
  AccessItems ||--o{ AccessItemReviews : reviewed_by
  AccessItems ||--o{ AccessItems : resubmits
  AccessRequests ||--o{ RequestAuditTrail : logged_in
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
